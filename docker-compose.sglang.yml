# Docker Compose for SGLang (Linux/CUDA only)
# For macOS: This will run in CPU-only mode which is VERY SLOW
# Recommended: Use llama.cpp for macOS instead

version: '3.8'

services:
  sglang-server:
    image: lmsysorg/sglang:latest
    # For CUDA support on Linux, uncomment:
    # runtime: nvidia
    # environment:
    #   - NVIDIA_VISIBLE_DEVICES=all
    ports:
      - "${SGLANG_PORT:-30000}:30000"
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-0}
    command: >
      python3 -m sglang.launch_server
      --model-path ${SGLANG_MODEL:-Qwen/Qwen2.5-0.5B-Instruct}
      --host 0.0.0.0
      --port 30000
      --tp-size ${SGLANG_TP_SIZE:-1}
      --mem-fraction 0.85
    # CPU-only fallback for macOS (very slow!)
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:30000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  huggingface_cache:
